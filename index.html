const SB_KEY    = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlcWZidG9mZXZtY2dhZnl3bHJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTczNDksImV4cCI6MjA5NzU3MzM0OX0.Eq0r8z9bSuibgPjP4kpfNnusU3kCUrragzEcqFsI2Oo";

/* ── Database helpers ── */
function sbFetch(path, opts) {
  return fetch(SB_URL + "/rest/v1/" + path, Object.assign({ headers: sbHeaders }, opts || {}))
    .then(function(r) {
      if (!r.ok) return r.text().then(function(b) { throw new Error("SB " + r.status + ": " + b); });
      return r.status === 204 ? [] : r.json();
    });
}

function dbLoadSpots()  { return sbFetch("spots?order=created_at.asc&select=*"); }
function dbLoadBucket() { return sbFetch("bucket_spots?order=created_at.asc&select=*"); }

function dbUpsertSpot(spot, table) {
  table = table || "spots";
  var row = Object.assign({}, spot);
  // Supabase wants snake_case for some fields - map JS camelCase
  if (row.paintedAt !== undefined) { row.painted_at = row.paintedAt; delete row.paintedAt; }
  if (row.createdAt !== undefined) { row.created_at = row.createdAt; delete row.createdAt; }
  if (row.photoPainting !== undefined) { row.photo_painting = row.photoPainting; delete row.photoPainting; }
  if (row.photoScene !== undefined)    { row.photo_scene    = row.photoScene;    delete row.photoScene; }
  if (row.photoLocation !== undefined) { row.photo_location = row.photoLocation; delete row.photoLocation; }
  if (Array.isArray(row.tags)) row.tags = JSON.stringify(row.tags);
  return sbFetch(table + "?on_conflict=id", { method: "POST",
    headers: Object.assign({}, sbHeaders, { "Prefer": "resolution=merge-duplicates,return=representation" }),
    body: JSON.stringify(row) });
}

function dbDeleteSpot(id, table) {
  table = table || "spots";
  return sbFetch(table + "?id=eq." + id, { method: "DELETE" });
}

/* Map DB row → JS object */
function fromRow(row) {
  var r = Object.assign({}, row);
  if (r.painted_at !== undefined) { r.paintedAt = r.painted_at; delete r.painted_at; }
  if (r.created_at !== undefined) { r.createdAt = r.created_at; delete r.created_at; }
  if (r.photo_painting !== undefined) { r.photoPainting = r.photo_painting; delete r.photo_painting; }
  if (r.photo_scene !== undefined)    { r.photoScene    = r.photo_scene;    delete r.photo_scene; }
  if (r.photo_location !== undefined) { r.photoLocation = r.photo_location; delete r.photo_location; }
  if (typeof r.tags === "string") { try { r.tags = JSON.parse(r.tags); } catch(e) { r.tags = []; } }
  if (!Array.isArray(r.tags)) r.tags = [];
  return r;
}

/* ── Local storage fallback (used while Supabase loads + as cache) ── */
const LS_SPOTS  = "pai-spots-v4";
const LS_BUCKET = "pai-bucket-v4";
function lsLoad(key)      { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; } }
function lsSave(key, data){ try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) { console.warn("lsSave failed", e); } }

/* ── Photo upload ── */
function compressImage(file, maxPx, quality) {
  maxPx = maxPx || 1200; quality = quality || 0.72;
  return new Promise(function(res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(url);
      var scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob) { res(blob); }, "image/jpeg", quality);
    };
    img.onerror = rej; img.src = url;
  });
}

function uploadPhoto(file, spotId, field) {
  return compressImage(file).then(function(blob) {
    var path = spotId + "/" + field + "-" + Date.now() + ".jpg";
    return fetch(SB_URL + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
      method: "POST",
      headers: { "Authorization": "Bearer " + SB_KEY, "Content-Type": "image/jpeg", "x-upsert": "true" },
      body: blob
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(b) { throw new Error("HTTP " + r.status + ": " + b); });
      return SB_URL + "/storage/v1/object/public/" + SB_BUCKET + "/" + path;
    });
  });
}

function deletePhoto(url) {
  if (!url || url.indexOf(SB_URL) === -1) return Promise.resolve();
  var path = url.replace(SB_URL + "/storage/v1/object/public/" + SB_BUCKET + "/", "");
  return fetch(SB_URL + "/storage/v1/object/" + SB_BUCKET + "/" + path,
    { method: "DELETE", headers: { "Authorization": "Bearer " + SB_KEY } });
}

═══════════════════════════════════════════════════════════════════ */
const WEATHER = [
  { label:"☀️ Sunny",         value:"sunny" },
  { label:"⛅ Partly Cloudy", value:"partly-cloudy" },
  { label:"☁️ Overcast",      value:"overcast" },

  { label:"🌬️ Windy",         value:"windy" },
  { label:"❄️ Snowy",         value:"snowy" },

];
const LIGHTS = ["Golden Hour Morning","Midday","Afternoon","Golden Hour Evening",
  "Overcast Flat","Backlit","Side Lit","Dappled"];
const MONTHS = ["January","February","March","April","May","June",
  "July","August","September","October","November","December"];
const DAYS = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const SUGGESTED_TAGS = ["Trees","Water","Urban","Mountains","Fields","Buildings",

const fmtDate      = function(iso) { return new Date(iso).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); };
const weatherLabel = function(v)   { return (WEATHER.find(function(w){return w.value===v;})||{label:""}).label; };
const todayStr     = function()    { return new Date().toISOString().slice(0,10); };

/* ═══════════════════════════════════════════════════════════════════
   STYLES
═══════════════════════════════════════════════════════════════════ */
const S = {
  inp: { width:"100%", padding:"10px 12px", borderRadius:10, border:"1.5px solid #d6c4a8",

  saveBtn: { flex:2, padding:"12px 0", borderRadius:12, border:"none",

/* ═══════════════════════════════════════════════════════════════════
   SMALL COMPONENTS
═══════════════════════════════════════════════════════════════════ */
function TagPill({ tag, active, onClick, small }) {
  return (
    <button onClick={onClick} style={{
      padding: small ? "3px 9px" : "5px 12px", borderRadius:20, border:"none", cursor:"pointer",
      fontFamily:"Georgia,serif", fontSize: small ? 11 : 12,
      background: active ? "#c46a2e" : "#f0e8dc",
      color: active ? "#fff" : "#7a5c3e",
      transition:"all 0.15s", whiteSpace:"nowrap",
    }}>{tag}</button>
  );
}

function TagField({ tags, onChange }) {
  var [input, setInput] = useState("");
  var allTags = tags || [];
  var add = function(t) {
    var clean = t.trim().replace(/,+$/, "").trim();
    if (clean && allTags.indexOf(clean) === -1) onChange(allTags.concat([clean]));
    setInput("");
  };
  var remove = function(t) { onChange(allTags.filter(function(x){return x!==t;})); };
  return (
    <div>
      <label style={S.lbl}>TAGS (optional)</label>
      {allTags.length > 0 && (
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
          {allTags.map(function(t) { return (
            <span key={t} style={{display:"flex",alignItems:"center",gap:4,padding:"3px 10px",
              borderRadius:20,background:"#c46a2e",color:"#fff",fontFamily:"Georgia,serif",fontSize:12}}>
              {t}
              <button onClick={function(){remove(t);}} style={{background:"none",border:"none",cursor:"pointer",
                color:"rgba(255,255,255,0.8)",fontSize:14,padding:0,lineHeight:1}}>×</button>
            </span>
          ); })}
        </div>
      )}
      <input style={S.inp} value={input} onChange={function(e){setInput(e.target.value);}}
        onKeyDown={function(e){if(e.key==="Enter"||e.key===","){e.preventDefault();add(input);}}}
        placeholder="Type a tag and press Enter…" />
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:7}}>
        {SUGGESTED_TAGS.filter(function(t){return allTags.indexOf(t)===-1;}).map(function(t){return(
          <TagPill key={t} tag={t} active={false} onClick={function(){add(t);}} small/>
        );})}
      </div>
    </div>
  );
}

/* ── Photo field with retry ── */
function PhotoField({ label, value, onChange, spotId, field }) {
  var ref = useRef(null);
  var [busy,  setBusy]  = useState(false);
  var [err,   setErr]   = useState(null);
  var [pending, setPending] = useState(null); // file waiting for retry

  var doUpload = function(file) {
    setBusy(true); setErr(null); setPending(null);
    uploadPhoto(file, spotId || "tmp-" + Date.now(), field)
      .then(function(url) { onChange(url); setBusy(false); })
      .catch(function(er) {
        setErr("Upload failed: " + (er && er.message ? er.message : String(er)));
        setPending(file); setBusy(false);
      });
  };

  var handle = function(e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    e.target.value = ""; doUpload(file);
  };

  return (
    <div>
      <label style={S.lbl}>{label}</label>
      <input ref={ref} type="file" accept="image/*" onChange={handle} style={{display:"none"}}/>
      {value ? (
        <div style={{position:"relative",borderRadius:10,overflow:"hidden",border:"1.5px solid #d6c4a8"}}>
          <img src={value} alt="" style={{width:"100%",display:"block",maxHeight:200,objectFit:"cover"}}/>
          <div style={{position:"absolute",top:6,right:6,display:"flex",gap:6}}>
            <button type="button" onClick={function(){ref.current&&ref.current.click();}}
              style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",
                background:"rgba(59,42,26,0.75)",color:"#fff",fontSize:12}}>Change</button>
            <button type="button" onClick={function(){deletePhoto(value);onChange(null);}}
              style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",
                background:"rgba(180,40,20,0.75)",color:"#fff",fontSize:12}}>Remove</button>
          </div>
        </div>
      ) : (
        <button type="button" onClick={function(){ref.current&&ref.current.click();}}
          style={{width:"100%",padding:"14px 0",borderRadius:10,border:"1.5px dashed #d6c4a8",
            background:"#fffdf8",cursor:busy?"default":"pointer",color:busy?"#b09070":"#9a7a5a",
            fontFamily:"Georgia,serif",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {busy ? "⏳ Uploading…" : "📷 Add Photo"}
        </button>
      )}
      {err && (
        <div style={{fontSize:11,color:"#a03a10",marginTop:5,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span>{err}</span>
          {pending && (
            <button type="button" onClick={function(){doUpload(pending);}}
              style={{padding:"3px 10px",borderRadius:8,border:"none",cursor:"pointer",
                background:"#c46a2e",color:"#fff",fontSize:11,fontFamily:"Georgia,serif"}}>
              ↺ Retry
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAP (main view)
═══════════════════════════════════════════════════════════════════ */
function MapView({ spots, bucket, selectedId, onSelect, filterTypes }) {
  var mapRef = useRef(null), instRef = useRef(null), clusterRef = useRef(null);
  var [ready, setReady] = useState(!!(window.L && window.L.markerClusterGroup));

  useEffect(function() {
    if (window.L && window.L.markerClusterGroup) return;
    var loadScript = function(src) { return new Promise(function(res) {
      var s = document.createElement("script"); s.src = src; s.onload = res; document.head.appendChild(s);
    }); };
    var loadCSS = function(href) {
      var l = document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l);
    };
    loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css");
    loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css");
    loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css");
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js")
      .then(function() { return loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"); })
      .then(function() { setReady(true); });
  }, []);

  useEffect(function() {
    if (!ready || !mapRef.current || instRef.current) return;
    var L = window.L, all = spots.concat(bucket);
    var map = L.map(mapRef.current, {zoomControl:false})
      .setView(all.length ? [all[all.length-1].lat, all[all.length-1].lng] : [39.5,-98.35], all.length ? 12 : 4);
    L.control.zoom({position:"bottomright"}).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
    instRef.current = map;
    return function() { try{map.remove();}catch(e){} instRef.current=null; clusterRef.current=null; };
  }, [ready]); // eslint-disable-line

  useEffect(function() {
    var map = instRef.current; if (!map) return;
    var L = window.L;
    if (clusterRef.current) { map.removeLayer(clusterRef.current); clusterRef.current=null; }
    var cluster = L.markerClusterGroup({
      maxClusterRadius: 50,
      iconCreateFunction: function(c) {
        var n=c.getChildCount(), sz=n<5?"sm":n<15?"md":"lg";
        return L.divIcon({html:'<div class="pai-cluster pai-cluster-'+sz+'">'+n+'</div>',
          className:"",iconSize:L.point(sz==="sm"?32:sz==="md"?40:50,sz==="sm"?32:sz==="md"?40:50)});
      }
    });
    var filteredSpots = spots.filter(function(s) {
      return (s.paintedAt==="studio" && filterTypes.indexOf("studio")!==-1) ||
             (s.paintedAt!=="studio" && filterTypes.indexOf("location")!==-1);
    });
    var visBucket = filterTypes.indexOf("bucket")!==-1 ? bucket : [];
    var add = function(item, isBucket) {
      var sel = item.id===selectedId;
      var fillColor = isBucket ? (sel?"#2a9d8f":"#1a7a6e")
        : item.paintedAt==="studio" ? (sel?"#8B5E3C":"#5c3d20")
        : (sel?"#e8b84b":"#b8892a");
      var m = L.circleMarker([item.lat,item.lng],{
        radius:sel?13:9, fillColor:fillColor,
        color:isBucket?"#e0f5f3":item.paintedAt==="studio"?"#f5efe6":"#fff8e8",
        weight:2, fillOpacity:isBucket?0.88:0.92,
        ...(isBucket?{dashArray:"4 3"}:{})
      });
      var tagHtml = (item.tags||[]).length
        ? '<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">'+(item.tags||[]).map(function(t){return '<span style="background:#f0e8dc;color:#7a5c3e;border-radius:10px;padding:1px 6px;font-size:10px">'+t+'</span>';}).join("")+'</div>'
        : "";
      var photos = isBucket ? [item.photoLocation].filter(Boolean)
        : [item.photoPainting,item.photoScene].filter(Boolean);
      var photoHtml = photos.length
        ? '<div style="display:flex;gap:4px;margin-top:6px">'+photos.map(function(p){return '<img src="'+p+'" style="width:'+(photos.length===1?"100%":"48%")+';border-radius:6px;object-fit:cover;max-height:90px">';}).join("")+'</div>'
        : "";
      m.bindPopup('<div style="font-family:\'Georgia\',serif;min-width:150px;max-width:220px">'
        +(isBucket?'<span style="font-size:11px;color:#1a7a6e;font-weight:bold">BUCKET LIST</span><br/>':"")
        +'<strong style="color:#3b2a1a">'+item.name+'</strong>'
        +(!isBucket?'<br/><span style="color:#7a5c3e;font-size:12px">'+fmtDate(item.date)+'</span>'
          +'<br/><span>'+weatherLabel(item.weather)+'</span>'
          +'<br/><span style="font-size:11px;color:#9a7a5a">'+(item.paintedAt==="studio"?"🏠 Studio":"📍 On Location")+'</span>':"")
        +(item.notes?'<p style="margin:5px 0 0;font-size:12px;color:#555">'+item.notes+'</p>':"")
        +tagHtml+photoHtml+'</div>',{maxWidth:240});
      m.on("click",function(){onSelect(item.id);});
      cluster.addLayer(m);
    };
    filteredSpots.forEach(function(s){add(s,false);});
    visBucket.forEach(function(b){add(b,true);});
    map.addLayer(cluster);
    clusterRef.current = cluster;
    var all = filteredSpots.concat(visBucket);
    if (all.length===1) map.setView([all[0].lat,all[0].lng],13);
    else if (all.length>1) map.fitBounds(L.latLngBounds(all.map(function(s){return[s.lat,s.lng];})),{padding:[40,40]});
  }, [spots,bucket,selectedId,filterTypes]);

  return (
    <div style={{position:"relative",height:"100%",width:"100%"}}>
      {!ready&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",
        justifyContent:"center",background:"#f5ece0",color:"#7a5c3e",fontFamily:"Georgia,serif"}}>Loading map…</div>}
      <div ref={mapRef} style={{height:"100%",width:"100%",borderRadius:14}}/>
    </div>
  );
}

/* ── Map coordinate picker ── */
function MapPicker({ onPick, onCancel }) {
  var mapRef = useRef(null), instRef = useRef(null), markerRef = useRef(null);
  var [picked, setPicked] = useState(null);

  useEffect(function() {
    if (!mapRef.current || instRef.current) return;
    var L = window.L;
    var map = L.map(mapRef.current,{zoomControl:false}).setView([39.5,-98.35],4);
    L.control.zoom({position:"bottomright"}).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
    map.on("click",function(e) {
      var lat=e.latlng.lat.toFixed(5), lng=e.latlng.lng.toFixed(5);
      if (markerRef.current) map.removeLayer(markerRef.current);
      markerRef.current = L.circleMarker([lat,lng],{
        radius:10,fillColor:"#c46a2e",color:"#fff",weight:2,fillOpacity:0.9
      }).addTo(map);
      setPicked({lat:lat,lng:lng});
    });
    instRef.current = map;
    return function() { try{map.remove();}catch(e){} instRef.current=null; };
  }, []);

  return (
    <div style={{position:"fixed",inset:0,zIndex:2000,display:"flex",flexDirection:"column",background:"#3b2a1a"}}>
      <div style={{padding:"12px 16px",paddingTop:"calc(env(safe-area-inset-top,0px) + 12px)",
        display:"flex",alignItems:"center",justifyContent:"space-between",background:"#3b2a1a",flexShrink:0}}>
        <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:17,color:"#f5e8d0"}}>Pick Location</div>
        <button onClick={onCancel} style={{background:"rgba(255,255,255,0.1)",border:"none",
          borderRadius:"50%",width:32,height:32,color:"#f5e8d0",fontSize:18,cursor:"pointer",
          display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>
      <div style={{flex:1,position:"relative",overflow:"hidden"}}>
        <div className="map-picker-hint">
          {picked ? "📍 "+picked.lat+", "+picked.lng+" — tap again to move" : "Tap the map to place your spot"}
        </div>
        <div ref={mapRef} style={{height:"100%",width:"100%"}}/>
      </div>
      <div style={{padding:"12px 16px",paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 12px)",
        display:"flex",gap:10,background:"#3b2a1a",flexShrink:0}}>
        <button onClick={onCancel} style={{...S.cancelBtn,color:"#f5e8d0",borderColor:"rgba(255,255,255,0.2)"}}>Cancel</button>
        <button onClick={function(){if(picked)onPick(picked);}} disabled={!picked} style={{
          ...S.saveBtn, opacity:picked?1:0.4}}>Use This Location</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════════════════════════ */
function StatsView({ spots }) {
  if (!spots.length) return (
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",
      color:"#b09070",fontStyle:"italic",fontSize:14,padding:32,textAlign:"center"}}>
      No painting sessions yet — add your first spot to see stats!
    </div>
  );

  var onLoc  = spots.filter(function(s){return s.paintedAt!=="studio";}).length;
  var studio = spots.filter(function(s){return s.paintedAt==="studio";}).length;

  var byMonth = {};
  spots.forEach(function(s){ var k=s.date.slice(0,7); byMonth[k]=(byMonth[k]||0)+1; });
  var busiestEntry = Object.entries(byMonth).sort(function(a,b){return b[1]-a[1];})[0];
  var busiestLabel = busiestEntry ? (function(){var p=busiestEntry[0].split("-");return MONTHS[parseInt(p[1])-1]+" "+p[0];})() : "—";

  var byWeather = {};
  spots.forEach(function(s){ byWeather[s.weather]=(byWeather[s.weather]||0)+1; });
  var topWeather = Object.entries(byWeather).sort(function(a,b){return b[1]-a[1];})[0];

  var byMedium = {};
  spots.filter(function(s){return s.medium;}).forEach(function(s){var k=s.medium.trim();byMedium[k]=(byMedium[k]||0)+1;});
  var topMedium = Object.entries(byMedium).sort(function(a,b){return b[1]-a[1];})[0];

  var tagCounts = {};
  spots.forEach(function(s){(s.tags||[]).forEach(function(t){tagCounts[t]=(tagCounts[t]||0)+1;});});
  var topTags = Object.entries(tagCounts).sort(function(a,b){return b[1]-a[1];}).slice(0,8);

  // Year-view contribution graph (last 52 weeks)
  var weekMap = {};
  var now = new Date();
  spots.forEach(function(s){
    var d = new Date(s.date); var diff = Math.floor((now-d)/(7*24*3600*1000));
    if (diff>=0&&diff<52) weekMap[diff]=(weekMap[diff]||0)+1;
  });
  var maxWeek = Math.max.apply(null, Object.values(weekMap).concat([1]));

  // Last 6 months bar chart
  var last6 = Array.from({length:6},function(_,i){
    var d=new Date(); d.setMonth(d.getMonth()-5+i);
    var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    return {label:MONTHS[d.getMonth()].slice(0,3),count:byMonth[k]||0};
  });
  var maxCount = Math.max.apply(null, last6.map(function(m){return m.count;}).concat([1]));

  // Streak calculation
  var sortedDates = spots.map(function(s){return s.date.slice(0,10);}).sort().reverse();
  var uniqueDates = sortedDates.filter(function(d,i){return sortedDates.indexOf(d)===i;});
  var streak = 0, checkDate = new Date();
  checkDate.setHours(0,0,0,0);
  for (var i=0; i<uniqueDates.length; i++) {
    var d = new Date(uniqueDates[i]); d.setHours(0,0,0,0);
    var diff2 = Math.round((checkDate-d)/(24*3600*1000));
    if (diff2===0||diff2===1) { streak++; checkDate=d; } else break;
  }

  var Stat = function(p) { return (
    <div style={{background:"#fffdf7",borderRadius:14,padding:"16px 18px",border:"1.5px solid #e8dcc8",flex:1,minWidth:0}}>
      <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:4}}>{p.label}</div>
      <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:28,color:"#3b2a1a",fontWeight:"bold",lineHeight:1}}>{p.value}</div>
      {p.sub&&<div style={{fontSize:11,color:"#b09070",marginTop:4}}>{p.sub}</div>}
    </div>
  ); };

  return (
    <div style={{flex:1,overflowY:"auto",padding:"14px 14px 20px"}}>
      <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:"#3b2a1a",fontWeight:"bold",marginBottom:14}}>
        Your Painting Stats
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <Stat label="TOTAL SESSIONS" value={spots.length}/>
        <Stat label="CURRENT STREAK" value={streak} sub={streak===1?"day":"days painting"}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <Stat label="ON LOCATION" value={onLoc} sub={studio>0?studio+" in studio":undefined}/>
        <Stat label="BUSIEST MONTH" value={busiestEntry?busiestEntry[1]:"—"} sub={busiestLabel}/>
      </div>

      {/* 52-week contribution graph */}
      <div style={{background:"#fffdf7",borderRadius:14,padding:"16px 18px",border:"1.5px solid #e8dcc8",marginBottom:14}}>
        <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:10}}>LAST 52 WEEKS</div>
        <div style={{display:"flex",gap:2,flexWrap:"wrap"}}>
          {Array.from({length:52},function(_,i){
            var wk=51-i, cnt=weekMap[wk]||0;
            var intensity = cnt===0?0:Math.max(0.15,cnt/maxWeek);
            return <div key={i} style={{width:10,height:10,borderRadius:2,
              background:cnt===0?"#f0e8dc":("rgba(196,106,46,"+intensity+")")}}/>;
          })}
        </div>
        <div style={{fontSize:10,color:"#b09070",marginTop:6}}>Each square = one week · darker = more sessions</div>
      </div>

      {/* 6-month bar chart */}
      <div style={{background:"#fffdf7",borderRadius:14,padding:"16px 18px",border:"1.5px solid #e8dcc8",marginBottom:14}}>
        <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:12}}>LAST 6 MONTHS</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:6,height:70}}>
          {last6.map(function(m){return(
            <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{fontSize:10,color:"#b09070"}}>{m.count||""}</div>
              <div style={{width:"100%",borderRadius:4,
                background:m.count>0?"#c46a2e":"#f0e8dc",
                height:Math.max(4,Math.round((m.count/maxCount)*52))+"px",transition:"height 0.3s"}}/>
              <div style={{fontSize:10,color:"#9a7a5a"}}>{m.label}</div>
            </div>
          );})}
        </div>
      </div>

      {topWeather&&(
        <div style={{background:"#fffdf7",borderRadius:14,padding:"14px 18px",border:"1.5px solid #e8dcc8",marginBottom:14}}>
          <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:6}}>FAVOURITE WEATHER</div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:18,color:"#3b2a1a",fontWeight:"bold"}}>{weatherLabel(topWeather[0])}</div>
          <div style={{fontSize:12,color:"#b09070",marginTop:2}}>{topWeather[1]} session{topWeather[1]>1?"s":""}</div>
        </div>
      )}
      {topMedium&&(
        <div style={{background:"#fffdf7",borderRadius:14,padding:"14px 18px",border:"1.5px solid #e8dcc8",marginBottom:14}}>
          <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:6}}>FAVOURITE MEDIUM</div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:18,color:"#3b2a1a",fontWeight:"bold"}}>{topMedium[0]}</div>
          <div style={{fontSize:12,color:"#b09070",marginTop:2}}>{topMedium[1]} session{topMedium[1]>1?"s":""}</div>
        </div>
      )}
      {topTags.length>0&&(
        <div style={{background:"#fffdf7",borderRadius:14,padding:"14px 18px",border:"1.5px solid #e8dcc8"}}>
          <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",marginBottom:10}}>TOP SUBJECTS</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {topTags.map(function(entry){return(
              <span key={entry[0]} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",
                borderRadius:20,background:"#f5e8d6",fontFamily:"Georgia,serif",fontSize:13,color:"#3b2a1a"}}>
                {entry[0]}<span style={{fontSize:11,color:"#9a7a5a"}}>×{entry[1]}</span>
              </span>
            );})}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   TWO-STEP SPOT FORM
═══════════════════════════════════════════════════════════════════ */
const BLANK = { name:"", lat:"", lng:"", date:"", weather:"sunny", light:"Golden Hour Morning",
  temp:"", notes:"", medium:"", paintedAt:"location", tags:[],
  photoPainting:null, photoScene:null, photoLocation:null };

function SpotModal({ initial, editingBucket, onSave, onClose }) {
  var isEdit   = !!initial;
  var [isBucket, setIsBucket] = useState(editingBucket !== undefined && editingBucket !== null ? editingBucket : false);
  var [form, setForm] = useState(isEdit
    ? Object.assign({}, BLANK, initial, {lat:String(initial.lat), lng:String(initial.lng)})
    : Object.assign({}, BLANK, {date:todayStr()}));
  var [step, setStep]       = useState(1); // 1=essentials, 2=details
  var [err,  setErr]        = useState("");
  var [showPicker, setShowPicker] = useState(false);
  var [gps,  setGps]        = useState("idle");

  var set = function(k,v) { setForm(function(f){return Object.assign({},f,{[k]:v});}); };

  var useGps = function() {
    if (!navigator.geolocation) return;
    setGps("locating");
    navigator.geolocation.getCurrentPosition(
      function(pos) { setForm(function(f){return Object.assign({},f,{lat:pos.coords.latitude.toFixed(5),lng:pos.coords.longitude.toFixed(5)});}); setGps("done"); },
      function() { setGps("error"); },
      {enableHighAccuracy:true,timeout:10000}
    );
  };

  var handleNext = function() {
    if (!form.name.trim()) { setErr("Please enter a location name."); return; }
    if (!form.lat || !form.lng) { setErr("Please set a location (GPS or tap map)."); return; }
    var la=parseFloat(form.lat), lo=parseFloat(form.lng);
    if (isNaN(la)||isNaN(lo)||la<-90||la>90||lo<-180||lo>180) { setErr("Invalid coordinates."); return; }
    setErr(""); setStep(2);
  };

  var handleSave = function() {
    var la=parseFloat(form.lat), lo=parseFloat(form.lng);
    onSave(Object.assign({},form,{lat:la,lng:lo,
      id:initial&&initial.id?initial.id:Date.now().toString(),
      createdAt:initial&&initial.createdAt?initial.createdAt:new Date().toISOString()}), isBucket);
  };

  var title = isEdit?(editingBucket?"Edit Bucket List Spot":"Edit Painting Spot")
                    :(isBucket?"New Bucket List Spot":"New Painting Spot");

  if (showPicker) return (
    <MapPicker
      onPick={function(coords){set("lat",coords.lat);set("lng",coords.lng);setShowPicker(false);setGps("done");}}
      onCancel={function(){setShowPicker(false);}}/>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(30,18,8,0.6)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{background:"#fffdf7",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:560,
        boxShadow:"0 -8px 40px rgba(60,30,10,0.25)",maxHeight:"92dvh",display:"flex",flexDirection:"column"}}>
        {/* Handle + header */}
        <div style={{display:"flex",justifyContent:"center",padding:"10px 0 2px"}}>
          <div style={{width:40,height:4,borderRadius:2,background:"#d6c4a8"}}/>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 20px 10px"}}>
          <div>
            <h2 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:"#3b2a1a",margin:0}}>{title}</h2>
            {!isEdit&&<div style={{fontSize:11,color:"#9a7a5a",marginTop:2}}>Step {step} of 2 — {step===1?"Location":"Details"}</div>}
          </div>
          <button onClick={onClose} style={{background:"#f0e8dc",border:"none",cursor:"pointer",
            borderRadius:"50%",width:30,height:30,fontSize:15,color:"#7a5c3e",
            display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>

        {/* Step indicator */}
        {!isEdit&&(
          <div style={{display:"flex",gap:4,padding:"0 20px 12px"}}>
            {[1,2].map(function(s){return(
              <div key={s} style={{flex:1,height:3,borderRadius:2,
                background:s<=step?"#c46a2e":"#e8dcc8",transition:"background 0.3s"}}/>
            );})}
          </div>
        )}

        {/* Type toggle — only on step 1 for new spots */}
        {!isEdit&&step===1&&(
          <div style={{display:"flex",gap:6,margin:"0 20px 14px",padding:4,background:"#f0e8dc",borderRadius:12}}>
            {[["🎨","Painted",false],["⭐","Bucket List",true]].map(function(arr){var ico=arr[0],lbl=arr[1],val=arr[2];return(
              <button key={String(val)} onClick={function(){setIsBucket(val);}} style={{
                flex:1,padding:"8px 0",borderRadius:9,border:"none",cursor:"pointer",
                fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",transition:"all 0.15s",
                background:isBucket===val?"#fff":"transparent",color:isBucket===val?"#3b2a1a":"#9a7a5a",
                boxShadow:isBucket===val?"0 1px 6px rgba(0,0,0,0.1)":"none"}}>
                {ico} {lbl}
              </button>
            );})}
          </div>
        )}

        {err&&<div style={Object.assign({},S.err,{margin:"0 20px 10px"})}>{err}</div>}

        {/* Scrollable fields */}
        <div style={{overflowY:"auto",flex:1,padding:"0 20px 8px"}}>

          {/* ── STEP 1: Name + Location ── */}
          {(step===1||isEdit)&&(
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div>
                <label style={S.lbl}>LOCATION NAME</label>
                <input style={S.inp} value={form.name} onChange={function(e){set("name",e.target.value);}} placeholder="e.g. Riverside Willows"/>
              </div>
              {!isBucket&&<div>
                <label style={S.lbl}>DATE</label>
                <input style={S.inp} type="date" value={form.date} onChange={function(e){set("date",e.target.value);}}/>
              </div>}

              {/* Coordinate options */}
              <div>
                <label style={S.lbl}>LOCATION</label>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <button type="button" onClick={useGps} style={{
                    flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,
                    padding:"10px 0",borderRadius:10,border:"none",cursor:"pointer",
                    fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",transition:"all 0.2s",
                    background:gps==="done"?"#d4edda":gps==="locating"?"#e8dcc8":"linear-gradient(135deg,#c46a2e,#9a4820)",
                    color:gps==="done"?"#2a6b3a":gps==="locating"?"#7a5c3e":"#fff"}}>
                    {gps==="locating"?"⏳ Locating…":gps==="done"?"✓ GPS Got it!":"📍 Use GPS"}
                  </button>
                  <button type="button" onClick={function(){setShowPicker(true);}} style={{
                    flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,
                    padding:"10px 0",borderRadius:10,border:"1.5px solid #d6c4a8",cursor:"pointer",
                    background:"#fffdf8",fontFamily:"Georgia,serif",fontSize:13,color:"#7a5c3e"}}>
                    🗺 Tap on Map
                  </button>
                </div>
                {(form.lat&&form.lng)&&(
                  <div style={{fontSize:12,color:"#9a7a5a",textAlign:"center",padding:"6px 0"}}>
                    📍 {parseFloat(form.lat).toFixed(4)}, {parseFloat(form.lng).toFixed(4)}
                  </div>
                )}
                {/* Manual fallback */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:4}}>
                  <div>
                    <label style={S.lbl}>LATITUDE (manual)</label>
                    <input style={S.inp} type="text" value={form.lat} onChange={function(e){set("lat",e.target.value);}} placeholder="37.7749"/>
                  </div>
                  <div>
                    <label style={S.lbl}>LONGITUDE (manual)</label>
                    <input style={S.inp} type="text" value={form.lng} onChange={function(e){set("lng",e.target.value);}} placeholder="-122.4194"/>
                  </div>
                </div>
              </div>

              {/* On step 1 in edit mode, show all fields */}
              {isEdit&&<DetailsFields form={form} set={set} isBucket={isBucket}/>}
            </div>
          )}

          {/* ── STEP 2: Details ── */}
          {step===2&&!isEdit&&<DetailsFields form={form} set={set} isBucket={isBucket}/>}
        </div>

        {/* Footer buttons */}
        <div style={{display:"flex",gap:10,padding:"12px 20px 16px",borderTop:"1px solid #ede3d5"}}>
          {step===2&&!isEdit&&(
            <button onClick={function(){setErr("");setStep(1);}} style={S.cancelBtn}>← Back</button>
          )}
          {step===1&&!isEdit&&(
            <button onClick={onClose} style={S.cancelBtn}>Cancel</button>
          )}
          {isEdit&&(
            <button onClick={onClose} style={S.cancelBtn}>Cancel</button>
          )}
          {step===1&&!isEdit&&(
            <button onClick={handleNext} style={S.saveBtn}>Next →</button>
          )}
          {(step===2||isEdit)&&(
            <button onClick={handleSave} style={S.saveBtn}>{isEdit?"Save Changes":"Save Spot"}</button>
          )}
        </div>
      </div>
    </div>
  );
}

function DetailsFields({ form, set, isBucket }) {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:13}}>
      {!isBucket&&<>
        <div><label style={S.lbl}>WEATHER</label>
          <select style={S.inp} value={form.weather} onChange={function(e){set("weather",e.target.value);}}>
            {WEATHER.map(function(w){return <option key={w.value} value={w.value}>{w.label}</option>;})}
          </select></div>
        <div><label style={S.lbl}>LIGHT QUALITY</label>
          <select style={S.inp} value={form.light} onChange={function(e){set("light",e.target.value);}}>
            {LIGHTS.map(function(l){return <option key={l}>{l}</option>;})}
          </select></div>
        <div><label style={S.lbl}>TEMPERATURE (optional)</label>
          <input style={S.inp} value={form.temp} onChange={function(e){set("temp",e.target.value);}} placeholder="e.g. 18°C / 65°F"/></div>
        <div><label style={S.lbl}>MEDIUM (optional)</label>
          <input style={S.inp} value={form.medium} onChange={function(e){set("medium",e.target.value);}} placeholder="Oil, Watercolor, Pastel…"/></div>
        <div>
          <label style={S.lbl}>PAINTED WHERE?</label>
          <div style={{display:"flex",gap:6,padding:4,background:"#f0e8dc",borderRadius:12}}>
            {[["📍","On Location","location"],["🏠","In Studio","studio"]].map(function(arr){var ico=arr[0],lbl=arr[1],val=arr[2];return(
              <button key={val} type="button" onClick={function(){set("paintedAt",val);}} style={{
                flex:1,padding:"8px 0",borderRadius:9,border:"none",cursor:"pointer",
                fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",transition:"all 0.15s",
                background:form.paintedAt===val?"#fff":"transparent",color:form.paintedAt===val?"#3b2a1a":"#9a7a5a",
                boxShadow:form.paintedAt===val?"0 1px 6px rgba(0,0,0,0.1)":"none"}}>
                {ico} {lbl}
              </button>
            );})}
          </div>
        </div>
      </>}
      <div><label style={S.lbl}>NOTES</label>
        <textarea style={Object.assign({},S.inp,{minHeight:75,resize:"vertical"})}
          value={form.notes} onChange={function(e){set("notes",e.target.value);}}
          placeholder={isBucket?"Why paint here? Best time of year…":"What inspired you? Challenges, discoveries…"}/>
      </div>
      <TagField tags={form.tags||[]} onChange={function(v){set("tags",v);}}/>
      {!isBucket&&<>
        <PhotoField label="🎨  PHOTO OF PAINTING" value={form.photoPainting||null}
          onChange={function(v){set("photoPainting",v);}} spotId={form.id} field="painting"/>
        <PhotoField label="🏞  PHOTO OF SCENE" value={form.photoScene||null}
          onChange={function(v){set("photoScene",v);}} spotId={form.id} field="scene"/>
      </>}
      {isBucket&&
        <PhotoField label="🏞  PHOTO OF LOCATION" value={form.photoLocation||null}
          onChange={function(v){set("photoLocation",v);}} spotId={form.id} field="location"/>
      }
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════════════════════════════ */
function CalendarView({ spots, onSelectSpot }) {
  var today=new Date();
  var [yr,setYr]=useState(today.getFullYear()),[mo,setMo]=useState(today.getMonth()),[sel,setSel]=useState(null);
  var byDate={};
  spots.forEach(function(s){var k=s.date.slice(0,10);(byDate[k]=byDate[k]||[]).push(s);});
  var pad=function(n){return String(n).padStart(2,"0");};
  var keyFor=function(d){return yr+"-"+pad(mo+1)+"-"+pad(d);};
  var firstDay=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),todaySt=today.toISOString().slice(0,10);
  var prevMo=function(){setSel(null);mo===0?(setMo(11),setYr(function(y){return y-1;})):setMo(function(m){return m-1;});};
  var nextMo=function(){setSel(null);mo===11?(setMo(0),setYr(function(y){return y+1;})):setMo(function(m){return m+1;});};
  var cells=[].concat(Array.from({length:firstDay},function(){return null;}),Array.from({length:dim},function(_,i){return i+1;}));
  var selKey=sel?keyFor(sel):null,selSpots=selKey?(byDate[selKey]||[]):[];
  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",padding:"14px 14px 8px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button onClick={prevMo} style={{background:"#f0e8dc",border:"none",borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",color:"#7a5c3e",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:"#3b2a1a",fontWeight:"bold"}}>{MONTHS[mo]}</div>
          <div style={{fontSize:12,color:"#9a7a5a"}}>{yr}</div>
        </div>
        <button onClick={nextMo} style={{background:"#f0e8dc",border:"none",borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",color:"#7a5c3e",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
        {DAYS.map(function(d){return <div key={d} style={{textAlign:"center",fontSize:11,color:"#b09070",fontWeight:"bold",padding:"2px 0"}}>{d}</div>;})}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map(function(day,i){
          if(!day) return <div key={"e"+i}/>;
          var key=keyFor(day),ds=byDate[key]||[],has=ds.length>0,isToday=key===todaySt,isSel=day===sel;
          return <div key={key} onClick={function(){setSel(isSel?null:day);}} style={{
            aspectRatio:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            borderRadius:10,cursor:has?"pointer":"default",transition:"all 0.15s",position:"relative",
            background:isSel?"#c46a2e":isToday?"#f0e8dc":"transparent",
            border:isToday&&!isSel?"1.5px solid #d6b898":"1.5px solid transparent"}}>
            <span style={{fontSize:14,fontFamily:"Georgia,serif",color:isSel?"#fff":isToday?"#c46a2e":"#3b2a1a",fontWeight:isToday?"bold":"normal"}}>{day}</span>
            {has&&<div style={{position:"absolute",bottom:3,display:"flex",gap:2}}>
              {ds.slice(0,3).map(function(_,j){return <div key={j} style={{width:4,height:4,borderRadius:"50%",background:isSel?"rgba(255,255,255,0.85)":"#c46a2e"}}/>;})}</div>}
          </div>;
        })}
      </div>
      <div style={{flex:1,overflowY:"auto",marginTop:12}}>
        {sel&&selSpots.length===0&&<div style={{textAlign:"center",color:"#b09070",fontSize:13,padding:"16px 0",fontStyle:"italic"}}>No painting sessions this day.</div>}
        {selSpots.map(function(s){return(
          <div key={s.id} onClick={function(){onSelectSpot(s.id);}}
            style={{padding:"11px 13px",borderRadius:12,background:"#fffdf7",border:"1.5px solid #e8dcc8",marginBottom:8,cursor:"pointer"}}>
            {(s.photoPainting||s.photoScene)&&<div style={{display:"flex",gap:4,marginBottom:8}}>
              {[s.photoPainting,s.photoScene].filter(Boolean).map(function(p,i){return(
                <img key={i} src={p} alt="" style={{flex:1,height:70,objectFit:"cover",borderRadius:8}}/>
              );})}
            </div>}
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:15,color:"#3b2a1a",fontWeight:"bold"}}>{s.name}</div>
            <div style={{fontSize:13,color:"#9a7a5a",marginTop:2}}>{weatherLabel(s.weather)}{s.light?" · "+s.light:""}</div>
            {s.medium&&<div style={{fontSize:12,color:"#b09070"}}>{s.medium}</div>}
            {(s.tags||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
              {s.tags.map(function(t){return <span key={t} style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:"#f0e8dc",color:"#7a5c3e"}}>{t}</span>;})}</div>}
            {s.notes&&<div style={{fontSize:12,color:"#6b5040",marginTop:4,fontStyle:"italic"}}>"{s.notes.slice(0,80)+(s.notes.length>80?"…":"")}"</div>}
          </div>
        );})}
        {!sel&&<div style={{textAlign:"center",color:"#b09070",fontSize:13,padding:"12px 0",fontStyle:"italic"}}>Tap a day to see your sessions</div>}
      </div>
    </div>
  );
}

   SPOT CARD

function SpotCard({ spot, isSelected, isBucket, onSelect, onEdit, onDelete, onPromote }) {

  var badge=!isBucket&&(
    <span style={{fontSize:10,padding:"2px 7px",borderRadius:10,fontFamily:"Georgia,serif",marginLeft:6,verticalAlign:"middle",
      background:spot.paintedAt==="studio"?"#f0e8dc":"#fff8e0",
      color:spot.paintedAt==="studio"?"#5c3d20":"#8a6010",
      border:"1px solid "+(spot.paintedAt==="studio"?"#d6c4a8":"#e8d080")}}>
      {spot.paintedAt==="studio"?"🏠 Studio":"📍 On Location"}
    </span>
  );
  var hasPhotos=isBucket?!!spot.photoLocation:!!(spot.photoPainting||spot.photoScene);
  var photoItems=isBucket
    ?[{src:spot.photoLocation,lbl:"🏞 LOCATION"}]
    :[spot.photoPainting&&{src:spot.photoPainting,lbl:"🎨 PAINTING"},
      spot.photoScene&&{src:spot.photoScene,lbl:"🏞 SCENE"}].filter(Boolean);
  return (
    <div onClick={function(){onSelect(spot.id);}} style={{padding:"13px 15px",borderRadius:13,cursor:"pointer",marginBottom:9,
      transition:"all 0.18s",
      background:isSelected?(isBucket?"#e0f5f3":"#f5e8d6"):"#fffdf7",
      border:"1.5px solid "+(isSelected?(isBucket?"#2a9d8f":"#c46a2e"):"#e8dcc8"),
      boxShadow:isSelected?"0 4px 14px rgba(0,0,0,0.09)":"none"}}>
      {hasPhotos&&<div style={{display:"flex",gap:4,marginBottom:10}}>
        {photoItems.map(function(p,i){return(
          <div key={i} style={{flex:1,position:"relative"}}>
            <img src={p.src} alt="" style={{width:"100%",height:90,objectFit:"cover",borderRadius:8,display:"block"}}/>
            <div style={{position:"absolute",bottom:4,left:4,background:"rgba(59,42,26,0.65)",
              borderRadius:4,padding:"2px 5px",fontSize:9,color:"#fff"}}>{p.lbl}</div>
          </div>
        );})}
      </div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:15,color:"#3b2a1a",fontWeight:"bold"}}>{spot.name}{badge}</div>
          {!isBucket&&<div style={{fontSize:12,color:"#9a7a5a",marginTop:2}}>{fmtDate(spot.date)} · {weatherLabel(spot.weather)}</div>}
          {!isBucket&&spot.light&&<div style={{fontSize:11,color:"#b09070",marginTop:1}}>{spot.light+(spot.medium?" · "+spot.medium:"")}</div>}
          {!isBucket&&spot.temp&&<div style={{fontSize:11,color:"#b09070"}}>🌡 {spot.temp}</div>}
          {(spot.tags||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
            {spot.tags.map(function(t){return <span key={t} style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:"#f0e8dc",color:"#7a5c3e"}}>{t}</span>;})}</div>}
          {spot.notes&&<div style={{fontSize:12,color:"#6b5040",marginTop:5,fontStyle:"italic",lineHeight:1.4}}>"{spot.notes.slice(0,100)+(spot.notes.length>100?"…":"")}"</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,paddingLeft:10,flexShrink:0}}>
          <button onClick={function(e){e.stopPropagation();onEdit(spot.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:15,color:accent,padding:0}}>✏️</button>
          {isBucket&&<button onClick={function(e){e.stopPropagation();onPromote(spot.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:15,padding:0}}>🎨</button>}
          <button onClick={function(e){e.stopPropagation();onDelete(spot.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:15,color:"#c8a88a",padding:0}}>🗑</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   EXPORT / IMPORT
═══════════════════════════════════════════════════════════════════ */
function dl(blob,name){Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name}).click();}

function exportCSV(spots,bucket){
  var esc=function(v){return '"'+String(v||"").replace(/"/g,'""')+'"';};
  var rows=[
    ["Type","Name","Date","Lat","Lng","Weather","Light","Temp","Medium","PaintedAt","Tags","Notes"].join(","),
  ].concat(
    spots.map(function(s){return["Painted",s.name,s.date,s.lat,s.lng,weatherLabel(s.weather),s.light||"",s.temp||"",s.medium||"",s.paintedAt||"location",(s.tags||[]).join("|"),s.notes||""].map(esc).join(",");}),
    bucket.map(function(b){return["Bucket List",b.name,"",b.lat,b.lng,"","","","","",(b.tags||[]).join("|"),b.notes||""].map(esc).join(",");})
  );
  dl(new Blob([rows.join("\n")],{type:"text/csv"}),"plein-air-"+todayStr()+".csv");
}

function exportJSON(spots,bucket){
  dl(new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),spots:spots,bucket:bucket},null,2)],
    {type:"application/json"}),"plein-air-backup-"+todayStr()+".json");
}

function importJSON(file,onSuccess,onError){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!Array.isArray(d.spots)||!Array.isArray(d.bucket)) throw new Error("Invalid format.");
      onSuccess(d.spots,d.bucket);
    }catch(err){onError(err.message||"Could not read file.");}
  };
  r.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════════════ */
function App() {
  var [spots,    setSpots]    = useState(function(){return lsLoad(LS_SPOTS);});
  var [bucket,   setBucket]   = useState(function(){return lsLoad(LS_BUCKET);});
  var [dbReady,  setDbReady]  = useState(false);
  var [syncing,  setSyncing]  = useState(true);
  var [selId,    setSelId]    = useState(null);
  var [modal,    setModal]    = useState(null);
  var [showMenu, setShowMenu] = useState(false);
  var [toast,    setToast]    = useState(null);
  var [search,   setSearch]   = useState("");
  var [tab,      setTab]      = useState("map");
  var [filterTypes, setFilterTypes] = useState(["location","studio","bucket"]);
  var [activeTag, setActiveTag] = useState(null);
  var fileRef = useRef(null);

  // Load from Supabase on mount — localStorage is shown immediately as cache
  useEffect(function() {
    Promise.all([dbLoadSpots(), dbLoadBucket()])
      .then(function(results) {
        var dbSpots  = results[0].map(fromRow);
        var dbBucket = results[1].map(fromRow);
        setSpots(dbSpots);
        setBucket(dbBucket);
        lsSave(LS_SPOTS,  dbSpots);
        lsSave(LS_BUCKET, dbBucket);
        setDbReady(true);
      })
      .catch(function(err) {
        console.warn("Supabase load failed, using local cache:", err);
        setDbReady(false);
      })
      .finally(function() { setSyncing(false); });
  }, []);

  // Save to localStorage whenever state changes (cache)
  useEffect(function(){lsSave(LS_SPOTS,  spots);},  [spots]);
  useEffect(function(){lsSave(LS_BUCKET, bucket);}, [bucket]);

  var allTags = useMemo(function(){
    var s=new Set();
    spots.forEach(function(sp){(sp.tags||[]).forEach(function(t){s.add(t);});});
    return Array.from(s).sort();
  }, [spots]);

  var filt = function(arr) {
    return arr.filter(function(s){
      return (s.name.toLowerCase().indexOf(search.toLowerCase())!==-1 ||
        (s.notes||"").toLowerCase().indexOf(search.toLowerCase())!==-1) &&
        (!activeTag || (s.tags||[]).indexOf(activeTag)!==-1);
    });
  };

  var toggleFilter = function(type) {
    setFilterTypes(function(prev){
      return prev.indexOf(type)!==-1 ? (prev.length>1?prev.filter(function(t){return t!==type;}):prev) : prev.concat([type]);
    });
  };

  var handleSave = function(item, isBkt) {
    var table = isBkt ? "bucket_spots" : "spots";
    var upsert = function(prev) {
      return prev.some(function(x){return x.id===item.id;})
        ? prev.map(function(x){return x.id===item.id?item:x;})
        : prev.concat([item]);
    };
    if (isBkt) { setBucket(upsert); setSpots(function(p){return p.filter(function(x){return x.id!==item.id;});}); }
    else        { setSpots(upsert); setBucket(function(p){return p.filter(function(x){return x.id!==item.id;});}); }
    // Persist to Supabase
    dbUpsertSpot(item, table).catch(function(err){console.warn("DB save failed:",err);showToast("⚠️ Saved locally only — sync failed");});
    setSelId(item.id); setModal(null); setTab("map");
  };

  var openEdit = function(id) {
    var s=spots.find(function(x){return x.id===id;}), b=bucket.find(function(x){return x.id===id;});
    if(s) setModal({initial:s,editingBucket:false});
    if(b) setModal({initial:b,editingBucket:true});
  };

  var handleDelete = function(id) {
    if(!confirm("Remove this spot?")) return;
    var allItems=spots.concat(bucket);
    var item=allItems.find(function(x){return x.id===id;});
    if(item){[item.photoPainting,item.photoScene,item.photoLocation].filter(Boolean).forEach(deletePhoto);}
    var table = bucket.some(function(x){return x.id===id;}) ? "bucket_spots" : "spots";
    setSpots(function(p){return p.filter(function(s){return s.id!==id;});});
    setBucket(function(p){return p.filter(function(b){return b.id!==id;});});
    setSelId(function(p){return p===id?null:p;});
    dbDeleteSpot(id, table).catch(function(err){console.warn("DB delete failed:",err);});
  };

  var promote = function(id) {
    var b=bucket.find(function(x){return x.id===id;}); if(!b) return;
    var promoted=Object.assign({},b,{date:todayStr(),weather:"sunny",light:"Golden Hour Morning",
      temp:"",medium:"",paintedAt:"location",photoPainting:null,photoScene:null});
    setBucket(function(p){return p.filter(function(x){return x.id!==id;});});
    setSpots(function(p){return p.concat([promoted]);});
    dbDeleteSpot(id,"bucket_spots").then(function(){return dbUpsertSpot(promoted,"spots");})
      .catch(function(err){console.warn("DB promote failed:",err);});
    setSelId(id); setTab("map");
  };

  var showToast = function(msg){setToast(msg);setTimeout(function(){setToast(null);},3500);};

  var handleImport = function(e) {
    var file=e.target.files&&e.target.files[0]; if(!file) return;
    e.target.value="";
    importJSON(file,function(newSpots,newBucket){
      if(!confirm("Replace your data with "+newSpots.length+" painted spots and "+newBucket.length+" bucket list spots?")) return;
      lsSave(LS_SPOTS,newSpots); lsSave(LS_BUCKET,newBucket);
      setSpots(newSpots); setBucket(newBucket);
      // Sync to Supabase
      Promise.all(
        newSpots.map(function(s){return dbUpsertSpot(s,"spots");}).concat(
        newBucket.map(function(b){return dbUpsertSpot(b,"bucket_spots");}))
      ).catch(function(err){console.warn("Import sync failed:",err);});
      setShowMenu(false);
      showToast("✓ Restored "+newSpots.length+" spots · "+newBucket.length+" bucket items");
    },function(msg){alert("Import failed: "+msg);});
  };

  var Tab=function(p){return(
    <button onClick={function(){setTab(p.t);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
      gap:2,padding:"8px 0",border:"none",cursor:"pointer",background:"transparent",
      color:tab===p.t?"#c46a2e":"#9a7a5a",fontFamily:"Georgia,serif",fontSize:10,letterSpacing:"0.06em",transition:"color 0.15s"}}>
      <span style={{fontSize:19}}>{p.icon}</span>{p.label}
    </button>
  );};

  var ListPane=function(p){return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"11px 13px 7px",display:"flex",flexDirection:"column",gap:8}}>
        <input placeholder={p.isBucket?"Search bucket list…":"Search journal…"}
          value={search} onChange={function(e){setSearch(e.target.value);}}
          style={Object.assign({},S.inp,{background:"#fffdf7",borderRadius:12,fontSize:15})}/>
        {!p.isBucket&&allTags.length>0&&(
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
            <TagPill tag="All" active={!activeTag} onClick={function(){setActiveTag(null);}} small/>
            {allTags.map(function(t){return <TagPill key={t} tag={t} active={activeTag===t}
              onClick={function(){setActiveTag(activeTag===t?null:t);}} small/>;})}</div>
        )}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"4px 13px 12px"}}>
        {filt(p.items).length===0&&<div style={{textAlign:"center",color:p.isBucket?"#1a7a6e":"#b09070",
          fontSize:13,padding:"36px 16px",fontStyle:"italic",lineHeight:1.8}}>{p.emptyMsg}</div>}
        {filt(p.items).slice().reverse().map(function(s){return(
          <SpotCard key={s.id} spot={s} isSelected={s.id===selId} isBucket={p.isBucket}
            onSelect={function(id){setSelId(id);setTab("map");}} onEdit={openEdit}
            onDelete={handleDelete} onPromote={promote}/>
        );})}
      </div>
    </div>
  );};

  return (
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",fontFamily:"Georgia,serif",background:"#f5ece0"}}>

      {/* Sync banner */}
      {syncing&&(
        <div style={{background:"#3b2a1a",color:"#b09070",padding:"4px 16px",fontSize:11,
          fontFamily:"Georgia,serif",textAlign:"center",flexShrink:0,letterSpacing:"0.06em"}}>
          ⟳ Syncing with cloud…
        </div>
      )}
      {!syncing&&!dbReady&&(
        <div style={{background:"#ffe9c0",color:"#7a4500",padding:"6px 16px",fontSize:11,
          fontFamily:"Georgia,serif",textAlign:"center",flexShrink:0}}>
          ⚠️ Offline — showing cached data. Changes will sync when connected.
        </div>
      )}

      {/* Header */}
      <div style={{paddingTop:"calc(env(safe-area-inset-top,0px) + 12px)",paddingBottom:"12px",
        paddingLeft:16,paddingRight:16,display:"flex",alignItems:"center",justifyContent:"space-between",
        background:"#3b2a1a",boxShadow:"0 2px 12px rgba(30,15,5,0.35)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🎨</span>
          <div>
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:17,color:"#f5e8d0"}}>Plein Air Journal</div>
            <div style={{fontSize:10,color:"#b09070",letterSpacing:"0.1em"}}>{spots.length} PAINTED · {bucket.length} BUCKET</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",position:"relative"}}>
          <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
          <button onClick={function(){setShowMenu(function(m){return !m;});}}
            style={{padding:"7px 10px",borderRadius:9,border:"none",background:"rgba(255,255,255,0.1)",
              color:"#f5e8d0",fontSize:18,cursor:"pointer",lineHeight:1}}>⋯</button>
          {showMenu&&<>
            <div onClick={function(){setShowMenu(false);}} style={{position:"fixed",inset:0,zIndex:998}}/>
            <div style={{position:"absolute",top:"calc(100% + 8px)",right:0,zIndex:999,
              background:"#fffdf7",borderRadius:12,boxShadow:"0 4px 20px rgba(0,0,0,0.18)",
              border:"1px solid #e8dcc8",minWidth:190,overflow:"hidden"}}>
              {[
                ["⬇️","Backup (JSON)",  function(){exportJSON(spots,bucket);setShowMenu(false);}],
                ["📄","Export CSV",     function(){exportCSV(spots,bucket);setShowMenu(false);}],
                ["⬆️","Restore Backup", function(){fileRef.current&&fileRef.current.click();setShowMenu(false);}],
              ].map(function(arr){var ico=arr[0],lbl=arr[1],fn=arr[2];return(
                <button key={lbl} onClick={fn} style={{display:"flex",alignItems:"center",gap:10,
                  width:"100%",padding:"12px 16px",border:"none",background:"transparent",cursor:"pointer",
                  textAlign:"left",fontFamily:"Georgia,serif",fontSize:14,color:"#3b2a1a",borderBottom:"1px solid #f0e8dc"}}>
                  <span style={{fontSize:16}}>{ico}</span>{lbl}
                </button>
              );})}
            </div>
          </>}
          <button onClick={function(){setModal({});}}
            style={{padding:"9px 16px",borderRadius:20,border:"none",
              background:"linear-gradient(135deg,#c46a2e,#9a4820)",color:"#fff",
              fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",cursor:"pointer",
              boxShadow:"0 3px 12px rgba(160,60,10,0.45)"}}>+ Add</button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {tab==="map"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{display:"flex",gap:6,padding:"8px 12px",background:"#f5ece0",flexShrink:0}}>
              {[["location","🟡","On Location"],["studio","🟤","Studio"],["bucket","🟢","Bucket"]].map(function(arr){
                var type=arr[0],dot=arr[1],label=arr[2];
                return <button key={type} onClick={function(){toggleFilter(type);}} style={{
                  display:"flex",alignItems:"center",gap:5,padding:"5px 11px",
                  borderRadius:20,border:"none",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,
                  background:filterTypes.indexOf(type)!==-1?"#3b2a1a":"#e8dcc8",
                  color:filterTypes.indexOf(type)!==-1?"#f5e8d0":"#9a7a5a",
                  transition:"all 0.15s"}}>
                  {dot} {label}
                </button>;
              })}
            </div>
            <div style={{flex:1,padding:"0 12px 12px",overflow:"hidden",position:"relative"}}>
              <MapView spots={filt(spots)} bucket={filt(bucket)} selectedId={selId} onSelect={setSelId} filterTypes={filterTypes}/>
            </div>
          </div>
        )}
        {tab==="list"  &&<ListPane items={spots}  isBucket={false} emptyMsg={spots.length===0?"No spots yet.\nTap + Add to log your first session.":"No spots match your search."}/>}
        {tab==="cal"   &&<CalendarView spots={spots} onSelectSpot={function(id){setSelId(id);setTab("map");}}/>}
        {tab==="bucket"&&<ListPane items={bucket} isBucket={true}  emptyMsg={bucket.length===0?"No bucket list spots yet.\nTap + Add → Bucket List to add one.":"No spots match your search."}/>}
        {tab==="stats" &&<StatsView spots={spots}/>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:"#fffdf7",borderTop:"1px solid #e8dcc8",flexShrink:0,
        paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        <Tab t="map"    icon="🗺"  label="MAP"/>
        <Tab t="cal"    icon="📅"  label="CALENDAR"/>
        <Tab t="list"   icon="☰"   label="JOURNAL"/>
        <Tab t="bucket" icon="⭐"  label="BUCKET"/>
        <Tab t="stats"  icon="📊"  label="STATS"/>
      </div>

      {modal&&<SpotModal initial={modal.initial} editingBucket={modal.editingBucket}
        onSave={handleSave} onClose={function(){setModal(null);}}/>}

      {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:2000,
        background:"#3b2a1a",color:"#f5e8d0",padding:"10px 18px",borderRadius:20,
        fontSize:13,fontFamily:"Georgia,serif",boxShadow:"0 4px 16px rgba(0,0,0,0.25)",
        whiteSpace:"nowrap",pointerEvents:"none"}}>{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
