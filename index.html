<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ─── Storage ───────────────────────────────────────────────────── */
const LS_SPOTS  = "pai-spots-v3";
const LS_BUCKET = "pai-bucket-v3";
function lsLoad(key) {
  try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; }
}
function lsSave(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch(e) { alert("⚠️ Could not save — storage may be full. Please export a backup."); }
}


/* ─── Supabase photo storage ─────────────────────────────────────── */
var SUPA_URL = "https://seqfbtofevmcgafywlrh.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlcWZidG9mZXZtY2dhZnl3bHJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5OTczNDksImV4cCI6MjA5NzU3MzM0OX0.Eq0r8z9bSuibgPjP4kpfNnusU3kCUrragzEcqFsI2Oo";
var SUPA_BUCKET = "Paintings";

function compressImage(file, maxPx, quality) {
  maxPx = maxPx || 1200;
  quality = quality || 0.72;
  return new Promise(function(res, rej) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(url);
      var scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob) { res(blob); }, "image/jpeg", quality);
    };
    img.onerror = rej;
    img.src = url;
  });
}

function uploadPhoto(file, spotId, field) {
  return compressImage(file).then(function(blob) {
    var path = spotId + "/" + field + "-" + Date.now() + ".jpg";
    return fetch(SUPA_URL + "/storage/v1/object/" + SUPA_BUCKET + "/" + path, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + SUPA_KEY,
        "Content-Type": "image/jpeg",
        "x-upsert": "true"
      },
      body: blob
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(body){ throw new Error("HTTP " + r.status + ": " + body); });
      return SUPA_URL + "/storage/v1/object/public/" + SUPA_BUCKET + "/" + path;
    });
  });
}

function deletePhoto(url) {
  if (!url || url.indexOf(SUPA_URL) === -1) return Promise.resolve();
  var path = url.replace(SUPA_URL + "/storage/v1/object/public/" + SUPA_BUCKET + "/", "");
  return fetch(SUPA_URL + "/storage/v1/object/" + SUPA_BUCKET + "/" + path, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + SUPA_KEY }
  });
}

/* ─── Constants ──────────────────────────────────────────────────── */
const WEATHER = [
  { label:"☀️ Sunny",         value:"sunny" },
  { label:"⛅ Partly Cloudy", value:"partly-cloudy" },
  { label:"☁️ Overcast",      value:"overcast" },
  { label:"🌫️ Foggy",         value:"foggy" },
  { label:"🌧️ Rainy",         value:"rainy" },
  { label:"🌬️ Windy",         value:"windy" },
  { label:"❄️ Snowy",         value:"snowy" },
  { label:"🌩️ Stormy",        value:"stormy" },
];
const LIGHTS = [
  "Golden Hour Morning","Midday","Afternoon","Golden Hour Evening",
  "Overcast Flat","Backlit","Side Lit","Dappled",
];
const MONTHS = ["January","February","March","April","May","June",
  "July","August","September","October","November","December"];
const DAYS = ["Su","Mo","Tu","We","Th","Fr","Sa"];
const SUGGESTED_TAGS = ["Trees","Water","Urban","Mountains","Fields","Buildings",
  "Figures","Animals","Coast","Desert","Snow","Sunset","Sunrise","Night"];

const fmtDate      = iso => new Date(iso).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
const weatherLabel = v   => (WEATHER.find(function(w){return w.value===v;})||{label:""}).label;
const todayStr     = ()  => new Date().toISOString().slice(0,10);

/* ─── Shared styles ─────────────────────────────────────────────── */
const S = {
  inp: { width:"100%", padding:"10px 12px", borderRadius:10, border:"1.5px solid #d6c4a8",
    background:"#fffdf8", fontFamily:"Georgia,serif", fontSize:15, color:"#3b2a1a",
    outline:"none", boxSizing:"border-box" },
  lbl: { fontSize:11, color:"#9a7a5a", letterSpacing:"0.1em", fontFamily:"Georgia,serif", marginBottom:4, display:"block" },
  cancelBtn: { flex:1, padding:"12px 0", borderRadius:12, border:"1.5px solid #d6c4a8",
    background:"transparent", color:"#7a5c3e", fontFamily:"Georgia,serif", fontSize:14, cursor:"pointer" },
  saveBtn: { flex:2, padding:"12px 0", borderRadius:12, border:"none",
    background:"linear-gradient(135deg,#c46a2e,#9a4820)", color:"#fff",
    fontFamily:"Georgia,serif", fontSize:14, fontWeight:"bold",
    cursor:"pointer", boxShadow:"0 4px 14px rgba(160,60,10,0.3)" },

};

/* ─── Tag pill ──────────────────────────────────────────────────── */
function TagPill({ tag, active, onClick, small }) {
  return (
    <button onClick={onClick} style={{
      padding: small ? "3px 9px" : "5px 12px",
      borderRadius:20, border:"none", cursor:"pointer",
      fontFamily:"Georgia,serif", fontSize: small ? 11 : 12,
      background: active ? "#c46a2e" : "#f0e8dc",
      color: active ? "#fff" : "#7a5c3e",
      transition:"all 0.15s", whiteSpace:"nowrap",
    }}>{tag}</button>
  );
}

/* ─── Tag input field ───────────────────────────────────────────── */
function TagField({ tags, onChange }) {
  const [input, setInput] = useState("");
  const allTags = tags || [];

  const add = t => {
    const clean = t.trim().replace(/,+$/,"").trim();
    if (clean && !allTags.includes(clean)) onChange([...allTags, clean]);
    setInput("");
  };
  const remove = t => onChange(allTags.filter(x=>x!==t));

  return (
    <div>
      <label style={S.lbl}>TAGS (optional)</label>
      {/* current tags */}
      {allTags.length > 0 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:8 }}>
          {allTags.map(t => (
            <span key={t} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 10px",
              borderRadius:20, background:"#c46a2e", color:"#fff",
              fontFamily:"Georgia,serif", fontSize:12 }}>
              {t}
              <button onClick={()=>remove(t)} style={{ background:"none", border:"none", cursor:"pointer",
                color:"rgba(255,255,255,0.8)", fontSize:14, padding:0, lineHeight:1 }}>×</button>
            </span>
          ))}
        </div>
      )}
      {/* text input */}
      <input style={S.inp} value={input}
        onChange={e=>setInput(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter"||e.key===","){ e.preventDefault(); add(input); }}}
        placeholder="Type a tag and press Enter…" />
      {/* suggestions */}
      <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginTop:7 }}>
        {SUGGESTED_TAGS.filter(t=>!allTags.includes(t)).map(t=>(
          <TagPill key={t} tag={t} active={false} onClick={()=>add(t)} small />
        ))}
      </div>
    </div>
  );
}


/* ─── Photo field ───────────────────────────────────────────────── */
function PhotoField({ label, value, onChange, spotId, field }) {
  var ref = useRef(null);
  var [busy, setBusy] = useState(false);
  var [err,  setErr]  = useState(null);

  var handle = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = "";
    setBusy(true); setErr(null);
    uploadPhoto(file, spotId || "tmp-" + Date.now(), field)
      .then(function(url) { onChange(url); setBusy(false); })
      .catch(function(er) { setErr("Upload failed: " + (er && er.message ? er.message : String(er))); setBusy(false); console.error("Upload error:", er); });
  };

  var handleRemove = function() {
    deletePhoto(value);
    onChange(null);
  };

  return (
    <div>
      <label style={S.lbl}>{label}</label>
      <input ref={ref} type="file" accept="image/*" onChange={handle} style={{display:"none"}}/>
      {value ? (
        <div style={{position:"relative",borderRadius:10,overflow:"hidden",border:"1.5px solid #d6c4a8"}}>
          <img src={value} alt="" style={{width:"100%",display:"block",maxHeight:200,objectFit:"cover"}}/>
          <div style={{position:"absolute",top:6,right:6,display:"flex",gap:6}}>
            <button type="button" onClick={function(){ref.current && ref.current.click();}}
              style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",background:"rgba(59,42,26,0.75)",color:"#fff",fontSize:12,fontFamily:"Georgia,serif"}}>Change</button>
            <button type="button" onClick={handleRemove}
              style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",background:"rgba(180,40,20,0.75)",color:"#fff",fontSize:12,fontFamily:"Georgia,serif"}}>Remove</button>
          </div>
        </div>
      ) : (
        <button type="button" onClick={function(){ref.current && ref.current.click();}}
          style={{width:"100%",padding:"14px 0",borderRadius:10,border:"1.5px dashed #d6c4a8",
            background:"#fffdf8",cursor:busy?"default":"pointer",color:busy?"#b09070":"#9a7a5a",
            fontFamily:"Georgia,serif",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {busy ? "⏳ Uploading…" : "📷 Add Photo"}
        </button>
      )}
      {err && <div style={{fontSize:11,color:"#a03a10",marginTop:4}}>{err}</div>}
    </div>
  );
}

/* ─── Map ───────────────────────────────────────────────────────── */
function MapView({ spots, bucket, selectedId, onSelect, filterTypes }) {
  const mapRef = useRef(null), instRef = useRef(null);
  const clusterRef = useRef(null);
  const [ready, setReady] = useState(!!(window.L && window.L.markerClusterGroup));

  useEffect(() => {
    if (window.L && window.L.markerClusterGroup) return;
    // Load Leaflet + MarkerCluster
    const loadScript = src => new Promise(res => {
      const s = document.createElement("script"); s.src = src; s.onload = res; document.head.appendChild(s);
    });
    const loadCSS = href => {
      const l = document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l);
    };
    (async () => {
      loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css");
      loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css");
      loadCSS("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js");
      setReady(true);
    })();
  }, []);

  // Init map once
  useEffect(() => {
    if (!ready || !mapRef.current || instRef.current) return;
    const L = window.L;
    const all = [...spots,...bucket];
    const map = L.map(mapRef.current, { zoomControl:false })
      .setView(all.length?[all[all.length-1].lat,all[all.length-1].lng]:[39.5,-98.35], all.length?12:4);
    L.control.zoom({ position:"bottomright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
    instRef.current = map;
    return () => { try{map.remove();}catch{} instRef.current=null; clusterRef.current=null; };
  }, [ready]); // eslint-disable-line

  // Update markers with clustering
  useEffect(() => {
    const map = instRef.current; if (!map) return;
    const L = window.L;

    // Remove old cluster layer
    if (clusterRef.current) { map.removeLayer(clusterRef.current); clusterRef.current = null; }

    const cluster = L.markerClusterGroup({
      maxClusterRadius: 50,
      iconCreateFunction: c => {
        const n = c.getChildCount();
        const sz = n < 5 ? "sm" : n < 15 ? "md" : "lg";
        return L.divIcon({ html:`<div class="pai-cluster pai-cluster-${sz}">${n}</div>`,
          className:"", iconSize:L.point(sz==="sm"?32:sz==="md"?40:50, sz==="sm"?32:sz==="md"?40:50) });
      },
    });

    const visSpots  = filterTypes.includes("location") || filterTypes.includes("studio") ? spots  : [];
    const visBucket = filterTypes.includes("bucket")                                      ? bucket : [];

    // filter spots by paintedAt type
    const filteredSpots = visSpots.filter(s =>
      (s.paintedAt==="studio" && filterTypes.includes("studio")) ||
      (s.paintedAt!=="studio" && filterTypes.includes("location"))
    );

    const add = (item, isBucket) => {
      const sel = item.id === selectedId;
      const fillColor = isBucket ? (sel?"#2a9d8f":"#1a7a6e")
        : item.paintedAt==="studio" ? (sel?"#8B5E3C":"#5c3d20")
        : (sel?"#e8b84b":"#b8892a");
      const marker = L.circleMarker([item.lat, item.lng], {
        radius:sel?13:9, fillColor,
        color:isBucket?"#e0f5f3":item.paintedAt==="studio"?"#f5efe6":"#fff8e8",
        weight:2, fillOpacity:isBucket?0.88:0.92,
        ...(isBucket?{dashArray:"4 3"}:{})
      });
      const tagHtml = (item.tags||[]).length
        ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">${(item.tags||[]).map(t=>`<span style="background:#f0e8dc;color:#7a5c3e;border-radius:10px;padding:1px 6px;font-size:10px">${t}</span>`).join("")}</div>`
        : "";
      marker.bindPopup(`<div style="font-family:'Georgia',serif;min-width:150px">
        ${isBucket?`<span style="font-size:11px;color:#1a7a6e;font-weight:bold">BUCKET LIST</span><br/>`:""}
        <strong style="color:#3b2a1a">${item.name}</strong>
        ${!isBucket?`<br/><span style="color:#7a5c3e;font-size:12px">${fmtDate(item.date)}</span>
          <br/><span>${weatherLabel(item.weather)}</span>
          <br/><span style="font-size:11px;color:#9a7a5a">${item.paintedAt==="studio"?"🏠 Studio":"📍 On Location"}</span>`:""}
        ${item.notes?`<p style="margin:5px 0 0;font-size:12px;color:#555">${item.notes}</p>`:""}
        ${tagHtml}
        ${(function(){var photos=isBucket?[item.photoLocation].filter(Boolean):[item.photoPainting,item.photoScene].filter(Boolean);return photos.length?'<div style="display:flex;gap:4px;margin-top:6px">'+photos.map(function(p){return'<img src="'+p+'" style="width:'+(photos.length===1?"100%":"48%")+';border-radius:6px;object-fit:cover;max-height:90px">'}).join("")+"</div>":"";})()}
      </div>`);
      marker.on("click", ()=>onSelect(item.id));
      cluster.addLayer(marker);
    };

    filteredSpots.forEach(s=>add(s,false));
    visBucket.forEach(b=>add(b,true));
    map.addLayer(cluster);
    clusterRef.current = cluster;

    const all = [...filteredSpots,...visBucket];
    if (all.length===1) map.setView([all[0].lat,all[0].lng],13);
    else if (all.length>1) map.fitBounds(L.latLngBounds(all.map(s=>[s.lat,s.lng])),{padding:[40,40]});
  }, [spots, bucket, selectedId, filterTypes]);

  return (
    <div style={{position:"relative",height:"100%",width:"100%"}}>
      {!ready&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",
        justifyContent:"center",background:"#f5ece0",color:"#7a5c3e",fontFamily:"Georgia,serif"}}>Loading map…</div>}
      <div ref={mapRef} style={{height:"100%",width:"100%",borderRadius:14}}/>
    </div>
  );
}

/* ─── Stats view ────────────────────────────────────────────────── */
function StatsView({ spots }) {
  if (spots.length === 0) return (
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",
      color:"#b09070",fontStyle:"italic",fontSize:14,fontFamily:"Georgia,serif",padding:32,textAlign:"center"}}>
      No painting sessions yet — add your first spot to see stats!
    </div>
  );

  const total = spots.length;
  const onLoc = spots.filter(s=>s.paintedAt!=="studio").length;
  const studio = spots.filter(s=>s.paintedAt==="studio").length;

  // Sessions by month
  const byMonth = {};
  spots.forEach(s => {
    const k = s.date.slice(0,7);
    byMonth[k] = (byMonth[k]||0) + 1;
  });
  const busiest = Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0];
  const busiestLabel = busiest ? (() => {
    const [yr,mo] = busiest[0].split("-");
    return `${MONTHS[parseInt(mo)-1]} ${yr}`;
  })() : "—";

  // Weather breakdown
  const byWeather = {};
  spots.forEach(s => { byWeather[s.weather]=(byWeather[s.weather]||0)+1; });
  const topWeather = Object.entries(byWeather).sort((a,b)=>b[1]-a[1])[0];

  // Medium breakdown
  const byMedium = {};
  spots.filter(s=>s.medium).forEach(s=>{
    const k=s.medium.trim();
    byMedium[k]=(byMedium[k]||0)+1;
  });
  const topMedium = Object.entries(byMedium).sort((a,b)=>b[1]-a[1])[0];

  // All tags
  const tagCounts = {};
  spots.forEach(s=>(s.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; }));
  const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Sessions per month for sparkline
  const last6months = Array.from({length:6},(_,i)=>{
    const d = new Date(); d.setMonth(d.getMonth()-5+i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    return { label:MONTHS[d.getMonth()].slice(0,3), count:byMonth[k]||0 };
  });
  const maxCount = Math.max(...last6months.map(m=>m.count),1);

  const StatCard = ({label,value,sub}) => (
    <div style={{background:"#fffdf7",borderRadius:14,padding:"16px 18px",border:"1.5px solid #e8dcc8",flex:1,minWidth:0}}>
      <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",fontFamily:"Georgia,serif",marginBottom:4}}>{label}</div>
      <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:28,color:"#3b2a1a",fontWeight:"bold",lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:"#b09070",marginTop:4}}>{sub}</div>}
    </div>
  );

  return (
    <div style={{flex:1,overflowY:"auto",padding:"14px 14px 20px"}}>
      <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:"#3b2a1a",fontWeight:"bold",marginBottom:14}}>
        Your Painting Stats
      </div>

      {/* Top row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <StatCard label="TOTAL SESSIONS" value={total} />
        <StatCard label="ON LOCATION" value={onLoc} sub={studio>0?`${studio} in studio`:undefined} />
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <StatCard label="BUSIEST MONTH" value={busiest?busiest[1]:"—"} sub={busiestLabel} />
        <StatCard label="FAVOURITE WEATHER" value={topWeather?topWeather[1]:"—"} sub={topWeather?weatherLabel(topWeather[0]):"—"} />
      </div>

      {/* Sessions chart — last 6 months */}
      <div style={{background:"#fffdf7",borderRadius:14,padding:"16px 18px",border:"1.5px solid #e8dcc8",marginBottom:14}}>
        <div style={{fontSize:11,color:"#9a7a5a",letterSpacing:"0.1em",fontFamily:"Georgia,serif",marginBottom:12}}>LAST 6 MONTHS</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:6,height:70}}>
          {last6months.map(({label,count})=>(
            <div key={label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>

/* ─── Form fields ───────────────────────────────────────────────── */

    if (!navigator.geolocation) return;
    setGps("locating");
    navigator.geolocation.getCurrentPosition(
      pos=>{setForm(f=>({...f,lat:pos.coords.latitude.toFixed(5),lng:pos.coords.longitude.toFixed(5)}));setGps("done");},
      ()=>setGps("error"),{enableHighAccuracy:true,timeout:10000}

  return (
    <div style={{display:"flex",flexDirection:"column",gap:13}}>
      <div>
        <label style={S.lbl}>LOCATION NAME</label>

            color:gps==="done"?"#2a6b3a":gps==="locating"?"#7a5c3e":"#fff"}}>

/* ─── Spot modal ────────────────────────────────────────────────── */
function SpotModal({ initial, editingBucket, onSave, onClose }) {
  const isEdit = !!initial;
  const [isBucket, setIsBucket] = useState(editingBucket !== undefined && editingBucket !== null ? editingBucket : false);
  const [form, setForm] = useState(isEdit
    ? {...BLANK,...initial,lat:String(initial.lat),lng:String(initial.lng)}
    : {...BLANK,date:todayStr()});
  const [err, setErr] = useState("");

  const handleSave = () => {
    if (!form.name.trim()) { setErr("Please enter a location name."); return; }
    const la=parseFloat(form.lat), lo=parseFloat(form.lng);
    if (isNaN(la)||isNaN(lo))           { setErr("Please enter valid coordinates."); return; }
    if (la<-90||la>90||lo<-180||lo>180) { setErr("Coordinates out of range."); return; }
    onSave({...form,lat:la,lng:lo,
      id:(initial && initial.id ? initial.id : Date.now().toString()),
      createdAt:(initial && initial.createdAt ? initial.createdAt : new Date().toISOString())}, isBucket);
  };

  const title = isEdit?(editingBucket?"Edit Bucket List Spot":"Edit Painting Spot")
                      :(isBucket?"New Bucket List Spot":"New Painting Spot");
  return (
    <Sheet title={title} onClose={onClose} onSave={handleSave} saveLabel={isEdit?"Save Changes":"Save"}>
      {!isEdit&&(
        <div style={{display:"flex",gap:6,marginBottom:14,padding:4,background:"#f0e8dc",borderRadius:12}}>
          {[["🎨","Painted",false],["⭐","Bucket List",true]].map(([ico,lbl,val])=>(
            <button key={String(val)} onClick={()=>setIsBucket(val)} style={{
              flex:1,padding:"8px 0",borderRadius:9,border:"none",cursor:"pointer",
              fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",transition:"all 0.15s",
              background:isBucket===val?"#fff":"transparent",color:isBucket===val?"#3b2a1a":"#9a7a5a",
              boxShadow:isBucket===val?"0 1px 6px rgba(0,0,0,0.1)":"none"}}>
              {ico} {lbl}
            </button>
          ))}
        </div>
      )}
      {err&&<div style={S.err}>{err}</div>}
      <FormFields form={form} setForm={setForm} isBucket={isBucket}/>
    </Sheet>
  );
}

/* ─── Calendar ──────────────────────────────────────────────────── */
function CalendarView({ spots, onSelectSpot }) {
  const today=new Date();
  const [yr,setYr]=useState(today.getFullYear()),[mo,setMo]=useState(today.getMonth()),[sel,setSel]=useState(null);
  const byDate={};
  spots.forEach(s=>{const k=s.date.slice(0,10);(byDate[k]=byDate[k]||[]).push(s);});
  const pad=n=>String(n).padStart(2,"0"),keyFor=d=>`${yr}-${pad(mo+1)}-${pad(d)}`;
  const firstDay=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),todaySt=today.toISOString().slice(0,10);
  const prevMo=()=>{setSel(null);mo===0?(setMo(11),setYr(y=>y-1)):setMo(m=>m-1);};
  const nextMo=()=>{setSel(null);mo===11?(setMo(0),setYr(y=>y+1)):setMo(m=>m+1);};
  const cells=[...Array(firstDay).fill(null),...Array(dim).fill(0).map((_,i)=>i+1)];
  const selKey=sel?keyFor(sel):null,selSpots=selKey?(byDate[selKey]||[]):[];
  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",padding:"14px 14px 8px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <button onClick={prevMo} style={{background:"#f0e8dc",border:"none",borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",color:"#7a5c3e",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:20,color:"#3b2a1a",fontWeight:"bold"}}>{MONTHS[mo]}</div>
          <div style={{fontSize:12,color:"#9a7a5a"}}>{yr}</div>
        </div>
        <button onClick={nextMo} style={{background:"#f0e8dc",border:"none",borderRadius:10,width:36,height:36,fontSize:20,cursor:"pointer",color:"#7a5c3e",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"#b09070",fontWeight:"bold",padding:"2px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((day,i)=>{
          if(!day) return <div key={"e"+i}/>;
          const key=keyFor(day),ds=byDate[key]||[],has=ds.length>0,isToday=key===todaySt,isSel=day===sel;
          return <div key={key} onClick={()=>setSel(isSel?null:day)} style={{
            aspectRatio:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            borderRadius:10,cursor:has?"pointer":"default",transition:"all 0.15s",position:"relative",
            background:isSel?"#c46a2e":isToday?"#f0e8dc":"transparent",
            border:isToday&&!isSel?"1.5px solid #d6b898":"1.5px solid transparent"}}>
            <span style={{fontSize:14,fontFamily:"Georgia,serif",color:isSel?"#fff":isToday?"#c46a2e":"#3b2a1a",fontWeight:isToday?"bold":"normal"}}>{day}</span>
            {has&&<div style={{position:"absolute",bottom:3,display:"flex",gap:2}}>
              {ds.slice(0,3).map((_,j)=><div key={j} style={{width:4,height:4,borderRadius:"50%",background:isSel?"rgba(255,255,255,0.85)":"#c46a2e"}}/>)}
            </div>}
          </div>;
        })}
      </div>
      <div style={{flex:1,overflowY:"auto",marginTop:12}}>
        {sel&&selSpots.length===0&&<div style={{textAlign:"center",color:"#b09070",fontSize:13,padding:"16px 0",fontStyle:"italic"}}>No painting sessions this day.</div>}
        {selSpots.map(s=>(
          <div key={s.id} onClick={()=>onSelectSpot(s.id)}
            style={{padding:"11px 13px",borderRadius:12,background:"#fffdf7",border:"1.5px solid #e8dcc8",marginBottom:8,cursor:"pointer"}}>
            {(s.photoPainting||s.photoScene)&&<div style={{display:"flex",gap:4,marginBottom:8}}>
              {[s.photoPainting,s.photoScene].filter(Boolean).map(function(p,i){return(
                <img key={i} src={p} alt="" style={{flex:1,height:70,objectFit:"cover",borderRadius:8}}/>
              );})}
            </div>}
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:15,color:"#3b2a1a",fontWeight:"bold"}}>{s.name}</div>
            <div style={{fontSize:13,color:"#9a7a5a",marginTop:2}}>{weatherLabel(s.weather)}{s.light?` · ${s.light}`:""}</div>
            {s.medium&&<div style={{fontSize:12,color:"#b09070"}}>{s.medium}</div>}
            {(s.tags||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
              {s.tags.map(t=><span key={t} style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:"#f0e8dc",color:"#7a5c3e"}}>{t}</span>)}

        {!sel&&<div style={{textAlign:"center",color:"#b09070",fontSize:13,padding:"12px 0",fontStyle:"italic"}}>Tap a day to see your sessions</div>}
      </div>
    </div>
  );
}

/* ─── Export / Import ───────────────────────────────────────────── */
function dl(blob,name){Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:name}).click();}

function exportCSV(spots,bucket){
  const esc=v=>`"${String(v||"").replace(/"/g,'""')}"`;
  const rows=[
    ["Type","Name","Date","Lat","Lng","Weather","Light","Temp","Medium","PaintedAt","Tags","Notes"].join(","),
    ...spots.map(s=>["Painted",s.name,s.date,s.lat,s.lng,weatherLabel(s.weather),s.light||"",s.temp||"",s.medium||"",s.paintedAt||"location",(s.tags||[]).join("|"),s.notes||""].map(esc).join(",")),
    ...bucket.map(b=>["Bucket List",b.name,"",b.lat,b.lng,"","","","","",(b.tags||[]).join("|"),b.notes||""].map(esc).join(",")),
  ];
  dl(new Blob([rows.join("\n")],{type:"text/csv"}),`plein-air-${todayStr()}.csv`);
}

function exportJSON(spots,bucket){
  dl(new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),spots,bucket},null,2)],
    {type:"application/json"}),`plein-air-backup-${todayStr()}.json`);
}

function importJSON(file,onSuccess,onError){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!Array.isArray(d.spots)||!Array.isArray(d.bucket)) throw new Error("Invalid format.");
      onSuccess(d.spots,d.bucket);
    }catch(err){onError(err.message||"Could not read file.");}
  };
  r.readAsText(file);
}

  // Tag filter for journal
  const [activeTag, setActiveTag] = useState(null);
  const fileRef = useRef(null);

  useEffect(()=>{lsSave(LS_SPOTS,spots);},[spots]);
  useEffect(()=>{lsSave(LS_BUCKET,bucket);},[bucket]);

  // All unique tags across spots
  const allTags = useMemo(()=>{
    const s=new Set();
    spots.forEach(sp=>(sp.tags||[]).forEach(t=>s.add(t)));
    return [...s].sort();
  },[spots]);

  const filt = arr => arr.filter(s=>
    (s.name.toLowerCase().includes(search.toLowerCase()) ||
    (s.notes||"").toLowerCase().includes(search.toLowerCase())) &&
    (activeTag ? (s.tags||[]).includes(activeTag) : true)
  );

  const toggleFilter = type => setFilterTypes(prev=>
    prev.includes(type) ? (prev.length>1?prev.filter(t=>t!==type):prev) : [...prev,type]
  );

  const handleSave=(item,isBkt)=>{
    const upsert=prev=>prev.some(x=>x.id===item.id)?prev.map(x=>x.id===item.id?item:x):[...prev,item];
    if(isBkt){setBucket(upsert);setSpots(p=>p.filter(x=>x.id!==item.id));}
    else{setSpots(upsert);setBucket(p=>p.filter(x=>x.id!==item.id));}
    setSelId(item.id);setModal(null);setTab("map");
  };

  const openEdit=id=>{
    const s=spots.find(x=>x.id===id),b=bucket.find(x=>x.id===id);
    if(s)setModal({initial:s,editingBucket:false});
    if(b)setModal({initial:b,editingBucket:true});
  };

  const handleDelete=id=>{
    if(!confirm("Remove this spot?"))return;
    const allItems=[...spots,...bucket];
    const item=allItems.find(x=>x.id===id);
    if(item){[item.photoPainting,item.photoScene,item.photoLocation].filter(Boolean).forEach(deletePhoto);}
    setSpots(p=>p.filter(s=>s.id!==id));
    setBucket(p=>p.filter(b=>b.id!==id));
    setSelId(p=>p===id?null:p);
  };

  const promote=id=>{
    const b=bucket.find(x=>x.id===id);if(!b)return;
    setBucket(p=>p.filter(x=>x.id!==id));
    setSpots(p=>[...p,{...b,date:todayStr(),weather:"sunny",light:"Golden Hour Morning",temp:"",medium:"",paintedAt:"location"}]);
    setSelId(id);setTab("map");
  };

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);};

  const handleImport=e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    e.target.value="";
    importJSON(file,(newSpots,newBucket)=>{
      if(!confirm(`Replace your data with ${newSpots.length} painted spots and ${newBucket.length} bucket list spots?`))return;
      lsSave(LS_SPOTS,newSpots);lsSave(LS_BUCKET,newBucket);
      setSpots(newSpots);setBucket(newBucket);
      setShowMenu(false);
      showToast(`✓ Restored ${newSpots.length} spots · ${newBucket.length} bucket items`);
    },msg=>alert("Import failed: "+msg));
  };

  const Tab=({t,icon,label})=>(
    <button onClick={()=>setTab(t)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
      gap:2,padding:"8px 0",border:"none",cursor:"pointer",background:"transparent",
      color:tab===t?"#c46a2e":"#9a7a5a",fontFamily:"Georgia,serif",fontSize:10,letterSpacing:"0.06em",transition:"color 0.15s"}}>
      <span style={{fontSize:19}}>{icon}</span>{label}
    </button>
  );

  const ListPane=({items,isBucket,emptyMsg})=>(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"11px 13px 7px",display:"flex",flexDirection:"column",gap:8}}>
        <input placeholder={isBucket?"Search bucket list…":"Search journal…"}
          value={search} onChange={e=>setSearch(e.target.value)}
          style={{...S.inp,background:"#fffdf7",borderRadius:12,fontSize:15}}/>
        {/* Tag filter pills — only for journal */}
        {!isBucket&&allTags.length>0&&(
          <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
            <TagPill tag="All" active={!activeTag} onClick={()=>setActiveTag(null)} small/>
            {allTags.map(t=><TagPill key={t} tag={t} active={activeTag===t} onClick={()=>setActiveTag(activeTag===t?null:t)} small/>)}
          </div>
        )}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"4px 13px 12px"}}>
        {filt(items).length===0&&<div style={{textAlign:"center",
          color:isBucket?"#1a7a6e":"#b09070",fontSize:13,padding:"36px 16px",fontStyle:"italic",lineHeight:1.8}}>{emptyMsg}</div>}
        {[...filt(items)].reverse().map(s=>(
          <SpotCard key={s.id} spot={s} isSelected={s.id===selId} isBucket={isBucket}
            onSelect={id=>{setSelId(id);setTab("map");}} onEdit={openEdit}
            onDelete={handleDelete} onPromote={promote}/>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{height:"100dvh",display:"flex",flexDirection:"column",fontFamily:"Georgia,serif",background:"#f5ece0"}}>

      {/* Header */}
      <div style={{paddingTop:"calc(env(safe-area-inset-top,0px) + 12px)",paddingBottom:"12px",
        paddingLeft:16,paddingRight:16,display:"flex",alignItems:"center",justifyContent:"space-between",
        background:"#3b2a1a",boxShadow:"0 2px 12px rgba(30,15,5,0.35)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🎨</span>
          <div>
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:17,color:"#f5e8d0"}}>Plein Air Journal</div>
            <div style={{fontSize:10,color:"#b09070",letterSpacing:"0.1em"}}>{spots.length} PAINTED · {bucket.length} BUCKET</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",position:"relative"}}>
          <input ref={fileRef} type="file" accept=".json" onChange={handleImport} style={{display:"none"}}/>
          <button onClick={()=>setShowMenu(m=>!m)}
            style={{padding:"7px 10px",borderRadius:9,border:"none",background:"rgba(255,255,255,0.1)",
              color:"#f5e8d0",fontSize:18,cursor:"pointer",lineHeight:1}}>⋯</button>
          {showMenu&&<>
            <div onClick={()=>setShowMenu(false)} style={{position:"fixed",inset:0,zIndex:998}}/>
            <div style={{position:"absolute",top:"calc(100% + 8px)",right:0,zIndex:999,
              background:"#fffdf7",borderRadius:12,boxShadow:"0 4px 20px rgba(0,0,0,0.18)",
              border:"1px solid #e8dcc8",minWidth:190,overflow:"hidden"}}>
              {[
                ["⬇️","Backup (JSON)",  ()=>{exportJSON(spots,bucket);setShowMenu(false);}],
                ["📄","Export CSV",     ()=>{exportCSV(spots,bucket);setShowMenu(false);}],
                ["⬆️","Restore Backup", ()=>{fileRef.current && fileRef.current.click();setShowMenu(false);}],
              ].map(([ico,lbl,fn])=>(
                <button key={lbl} onClick={fn} style={{display:"flex",alignItems:"center",gap:10,
                  width:"100%",padding:"12px 16px",border:"none",background:"transparent",cursor:"pointer",
                  textAlign:"left",fontFamily:"Georgia,serif",fontSize:14,color:"#3b2a1a",borderBottom:"1px solid #f0e8dc"}}>
                  <span style={{fontSize:16}}>{ico}</span>{lbl}
                </button>
              ))}
            </div>
          </>}
          <button onClick={()=>setModal({})}
            style={{padding:"9px 16px",borderRadius:20,border:"none",
              background:"linear-gradient(135deg,#c46a2e,#9a4820)",color:"#fff",
              fontFamily:"Georgia,serif",fontSize:13,fontWeight:"bold",cursor:"pointer",
              boxShadow:"0 3px 12px rgba(160,60,10,0.45)"}}>+ Add</button>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {tab==="map"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {/* Map filter bar */}
            <div style={{display:"flex",gap:6,padding:"8px 12px",background:"#f5ece0",flexShrink:0}}>
              {[["location","🟡","On Location"],["studio","🟤","Studio"],["bucket","🟢","Bucket"]].map(([type,dot,label])=>(
                <button key={type} onClick={()=>toggleFilter(type)} style={{
                  display:"flex",alignItems:"center",gap:5,padding:"5px 11px",
                  borderRadius:20,border:"none",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,
                  background:filterTypes.includes(type)?"#3b2a1a":"#e8dcc8",
                  color:filterTypes.includes(type)?"#f5e8d0":"#9a7a5a",
                  transition:"all 0.15s"}}>
                  {dot} {label}
                </button>
              ))}
            </div>
            <div style={{flex:1,padding:"0 12px 12px",overflow:"hidden",position:"relative"}}>
              <MapView spots={filt(spots)} bucket={filt(bucket)} selectedId={selId} onSelect={setSelId} filterTypes={filterTypes}/>
            </div>
          </div>
        )}
        {tab==="list"  &&<ListPane items={spots}  isBucket={false} emptyMsg={spots.length===0?"No spots yet.\nTap + Add to log your first session.":"No spots match your search."}/>}
        {tab==="cal"   &&<CalendarView spots={spots} onSelectSpot={id=>{setSelId(id);setTab("map");}}/>}
        {tab==="bucket"&&<ListPane items={bucket} isBucket={true}  emptyMsg={bucket.length===0?"No bucket list spots yet.\nTap + Add → Bucket List to add one.":"No spots match your search."}/>}
        {tab==="stats" &&<StatsView spots={spots}/>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:"#fffdf7",borderTop:"1px solid #e8dcc8",flexShrink:0,
        paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        <Tab t="map"    icon="🗺"  label="MAP"/>
        <Tab t="cal"    icon="📅"  label="CALENDAR"/>
        <Tab t="list"   icon="☰"   label="JOURNAL"/>
        <Tab t="bucket" icon="⭐"  label="BUCKET"/>
        <Tab t="stats"  icon="📊"  label="STATS"/>
      </div>

      {modal&&<SpotModal initial={modal.initial} editingBucket={modal.editingBucket}
        onSave={handleSave} onClose={()=>setModal(null)}/>}

      {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:2000,
        background:"#3b2a1a",color:"#f5e8d0",padding:"10px 18px",borderRadius:20,
        fontSize:13,fontFamily:"Georgia,serif",boxShadow:"0 4px 16px rgba(0,0,0,0.25)",
        whiteSpace:"nowrap",pointerEvents:"none"}}>{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
